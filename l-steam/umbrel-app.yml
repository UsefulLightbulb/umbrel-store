manifestVersion: 1
id: h-steam
name: Steam Headless
tagline: Steam + Sunshine in your browser
icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/steam.png
category: Gaming
version: "1.0.0"
port: 8083

description: >-
  Headless Steam with Sunshine streaming, accessible via browser (noVNC).

  ⚠️ Requires Intel/AMD GPU for hardware acceleration.
  Games install to /mnt/games — add this path as Steam library.

developer: josh5
website: https://github.com/Steam-Headless/docker-steam-headless
submitter: H
submission: https://github.com/H/umbrel-community-app-store
repo: https://github.com/H/umbrel-community-app-store
support: https://github.com/H/umbrel-community-app-store/issues

gallery:
  - https://i.imgur.com/cZWJM4s.png
  - https://i.imgur.com/UE4CGBu.png
  - https://i.imgur.com/zxSPszi.png

releaseNotes: >-
  Initial release of Steam Headless with Intel GPU support.

dependencies: []
defaultUsername: admin
defaultPassword: password
